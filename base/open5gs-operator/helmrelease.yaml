# HelmRelease for the Open5GS Operator
# Installs the controller that manages Open5GS CRDs
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open5gs-operator
  namespace: argocd
spec:
  project: default
  source:
    chart: open5gs-operator
    repoURL: registry-1.docker.io/gradiantcharts
    targetRevision: "1.0.5"
    helm:
      releaseName: open5gs-operator
  destination:
    server: "https://kubernetes.default.svc"
    namespace: open5gs
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
