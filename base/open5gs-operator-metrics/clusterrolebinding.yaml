# Lets Prometheus's ServiceAccount pass kube-rbac-proxy's authz check
# (SubjectAccessReview against nonResourceURL /metrics) on the operator's
# metrics endpoint. The open5gs-operator-metrics-reader ClusterRole is
# created by the open5gs-operator Helm chart itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open5gs-operator-metrics-reader-prometheus
subjects:
  - kind: ServiceAccount
    name: kube-prometheus-stack-prometheus
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: open5gs-operator-metrics-reader
  apiGroup: rbac.authorization.k8s.io
